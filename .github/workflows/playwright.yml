name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name : Generate Linux Screenshot Baseline
      run:  npx playwright test tests/visual.spec.ts -g "VIS-001" --update-snapshots
    - name: Upload Linux Screenshot Baseline
      uses: actions/upload-artifact@v4
      with:
        name: linux-screenshot-baseline
        path: tests/visual.spec.ts-snapshots/
        retention-days: 7   
    - name: Run Playwright Regression Tests
      run: npx playwright test --grep-invert "@known-defect"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
